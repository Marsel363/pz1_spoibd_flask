<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flask Project{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="site-header">
        <div class="container header-container">
            <div class="logo">
                <h1>Мой Flask-проект</h1>
            </div>
            <nav class="menu">
                <a href="{{ url_for('index') }}">Главная</a>
                <a href="{{ url_for('about') }}">О проекте</a>
                <a href="{{ url_for('changelog') }}">Лог изменений</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© 2026 Flask Project. Учебный сайт.</p>
        </div>
    </footer>

</body>
</html>
